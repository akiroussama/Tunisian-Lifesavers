services:
  lifesavers:
    build: .
    container_name: tunisian-lifesavers
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:8098"
    environment:
      - EDIT_CODE=${EDIT_CODE:?Définir EDIT_CODE dans .env}
    volumes:
      - lifesavers-data:/app/storage
volumes:
  lifesavers-data:
